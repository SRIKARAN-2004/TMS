server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets - purely a perf nicety
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router uses browser history (BrowserRouter), so a hard refresh
    # or direct link to e.g. /admin/tasks has to fall back to index.html
    # and let the client-side router take over - otherwise nginx 404s on
    # any route that isn't a real file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable long-term caching for hashed build assets (Vite fingerprints
    # its output filenames, so this is safe).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
